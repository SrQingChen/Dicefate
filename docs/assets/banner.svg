      <polygon points="256,104 401.5,188 401.5,356 256,440 110.5,356 110.5,188"/>
      <polygon points="256,210 184,334 328,334"/>
      <path d="M256,104 L256,210 M110.5,188 L256,210 M401.5,188 L328,334 M401.5,356 L328,334 M110.5,356 L184,334 M256,440 L184,334"/>
    </g>
    <path d="M 48,308 C 150,212 362,212 464,308" fill="none" stroke="url(#thread)" stroke-width="2.5"/>
    <circle cx="48" cy="308" r="3.5" fill="#3fc3a6" opacity="0.85"/>
    <circle cx="464" cy="308" r="3.5" fill="#e9cd7f" opacity="0.85"/>
