    <rect x="36" y="36" width="440" height="440" rx="92" fill="none"
          stroke="#e9cd7f" stroke-width="1" opacity="0.22"/>
    <path d="M 26,226 L 26,126 Q 26,26 126,26 L 386,26 Q 486,26 486,126 L 486,226 Z" fill="url(#glass)"/>
    <path d="M 78,68 Q 256,18 434,68" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- ===== text ===== -->
  <text x="336" y="88" font-family="'Segoe UI','Microsoft YaHei UI',sans-serif" font-size="15"
        letter-spacing="5" fill="#3fc3a6" opacity="0.9">MINECRAFT 26.1 · NEOFORGE</text>

  <text x="336" y="164" font-family="'Microsoft YaHei UI','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="72" font-weight="800" letter-spacing="6" fill="url(#titleGrad)"
        style="filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55))">骰掷命术</text>

  <text x="339" y="212" font-family="'Segoe UI','Microsoft YaHei UI',sans-serif" font-size="27"
