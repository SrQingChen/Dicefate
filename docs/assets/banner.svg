          style="filter: drop-shadow(0 0 12px rgba(246,224,150,0.55)) drop-shadow(0 2px 2px rgba(0,0,0,0.45))">命</text>
    <g fill="#fdf6df">
      <path d="M 402,112 C 404.2,124 406,125.8 418,128 C 406,130.2 404.2,132 402,144 C 399.8,132 398,130.2 386,128 C 398,125.8 399.8,124 402,112 Z" opacity="0.95"/>
      <path d="M 430,158 C 431.2,164.4 432.2,165.4 438.6,166.6 C 432.2,167.8 431.2,168.8 430,175.2 C 428.8,168.8 427.8,167.8 421.4,166.6 C 427.8,165.4 428.8,164.4 430,158 Z" opacity="0.7"/>
    </g>
