  <rect x="339" y="232" width="360" height="2" fill="url(#rule)" opacity="0.8"/>

  <text x="336" y="268" font-family="'Microsoft YaHei UI','Microsoft YaHei',sans-serif" font-size="21"
        letter-spacing="2" fill="#b9c9c0">命数潮汐之下，众生以骰局决胜负</text>
  <text x="336" y="298" font-family="'Segoe UI','Microsoft YaHei UI',sans-serif" font-size="16.5"
        font-style="italic" fill="#7f9187">Every blow is a dice contest — read the board, break poise, out-roll fate itself.</text>
</svg>
