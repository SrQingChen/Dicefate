    <circle cx="700" cy="42" r="1.6" opacity="0.3"/>
    <circle cx="880" cy="70" r="2.6" opacity="0.4"/>
    <circle cx="990" cy="140" r="1.8" opacity="0.3"/>
    <circle cx="1090" cy="96" r="2.2" opacity="0.35"/>
